	<script type="text/javascript">
	var plath=window.location.pathname;
		var buf=plath.split("/");
		console.log(buf)
		var CWizardSte;
		for(var i=0;i<buf.length;i++){
			console.log(buf[i])
			if(buf[i]=="superadmin"){
				CWizardSte=1;
			}else{
				CWizardSte=0;
			}
		}
		$(".CWizard").click(function(){
			window.location="main.html";
		})
		var NowMode=-1,IsFirst=true,curVersion=false,oldPass,animation="",REBOOT=null,set_restore=0,curlang;
		function checkWlanInfo(){
			if(NowMode==4 && curVersion)
			{
				var twoName=CheckSSID($("#doubleWifiName").val());
				if(!twoName){return false;}
				var twoPass=CheckSSIDKey($("#doubleWifiPass").val());
				if(!twoPass){return false;}	
				return true;
			}else
			{
				var oneName=CheckSSID($("#floatWifiName").val());
				if(!oneName){return false;}
				var onePass=CheckSSIDKey($("#floatWifiPass").val());
				if(!onePass){return false;}
				if(curVersion){
					var twoName=CheckSSID($("#doubleWifiName").val());
					if(!twoName){return false;}
					var twoPass=CheckSSIDKey($("#doubleWifiPass").val());
					if(!twoPass){return false;}			
				}
				return true;
			}
		}
		

		function IsChangeMode(){
			$("#wlan_after").unbind();
			$("#wlan_after").html(curlang.Apply);
			$("#wlan_after").click(function(){
				if(checkWlanInfo())
				{
 					showanimation(1);
 					showanimation(4);
					setTimeout(function(){setRouter();},2000);
				}
			})
		}
		//易操作绑定
		function compVer(str2,str1){
			var local_ver = str1.split(".");
			var ser_ver = str2.split(".");
			if(parseInt(local_ver[0]) < parseInt(ser_ver[0])){
				return true;
			}
			else if(parseInt(local_ver[0]) > parseInt(ser_ver[0])){
				return false;
			}
			else{
				if(parseInt(local_ver[1]) < parseInt(ser_ver[1])){
					return true;
				}
				else if(parseInt(local_ver[1]) > parseInt(ser_ver[1])){
					return false;
				}
				else{
					if(parseInt(local_ver[2].split("_")[0]) < parseInt(ser_ver[2].split("_")[0])){
						return true;
					}
					else if(parseInt(local_ver[2].split("_")[0]) > parseInt(ser_ver[2].split("_")[0])){
						return false;
					}
					else{
						return false;
					}
				}	
			}
			return false;	
		}
		//升级请求
			function restart(type){
				lb_restart(type);
				var word;
				if(type=="update"){word=curlang.updatetime}else{word=curlang.waitingtime;}
				window.reset=layer.open({
				  type: 1,
				  closeBtn: 0, //不显示关闭按钮
				  shift: 3,
				  offset:'150px',
				  skin:'layui-layer-loading',
				  scrollbar: false,
				  title: false,
				  shade: [0.7, '#000'],
				  content: '<div style="margin:0 auto;width:90px;height:90px;background: url(js/layer/skin/default/loading-2.gif) no-repeat;background-size: cover;-ms-behavior: url(/admin/backgroundsize.min.htc);behavior: url(/admin/backgroundsize.min.htc);" class="layui-layer-content layui-layer-loading2"></div><h4 style="text-align:center;font-size:15px;color:#fff"><span>'+word+'</span><label id="curTime" style="color:#7eda3d"></label>s</h4>'
				});	
			}
			function lb_restart(type) {
				var Time;
				if (type == "update") {
					Time =150;
				}
				else{
					if(curVersion){
						Time =60;

		//获取版本号浏览器 add by wgl 20170216 begin
		function myBrowser(){
			var userAgent = navigator.userAgent; //取得浏览器的userAgent字符串
			var isOpera = userAgent.indexOf("Opera") > -1; //判断是否Opera浏览器
			var isIE = userAgent.indexOf("compatible") > -1 && userAgent.indexOf("MSIE") > -1 && !isOpera; //判断是否IE浏览器
			if (isIE) {
				var IE8 = IE9 = false;
				var reIE = new RegExp("MSIE (\\d+\\.\\d+);");
				reIE.test(userAgent);
				var fIEVersion = parseFloat(RegExp["$1"]);
				IE8 = fIEVersion == 8.0;
				IE9 = fIEVersion == 9.0;
				if (IE8) {
					return "IE8";
				}
				if (IE9) {
					return "IE9";
				}
			}//isIE end
		}

		//动画显示 1 开始 2 成功 3 失败
		function showanimation(type){
			if(type==1){
				$("#msg_type").children("img").attr("src","images/122.gif");
				$("#msg").html(curlang.PeaseWait);					
				animation=layer.open({
				  type: 1,
				  closeBtn: 0, //不显示关闭按钮
				  shift: 3,
				  offset:'150px',
				  scrollbar: false,
				  title: false,
				  shade: [0.7, '#000'],
				  content: $('#message_layer')
				});	
			}
			if(type==2){
				$("#msg_type").children("img").attr("src","images/msg-success.png");
				$("#msg").html(curlang.Success);
				setTimeout(function(){layer.closeAll();restart('update');},2000);
			}
			if(type==3){
				$("#msg_type").children("img").attr("src","images/msg-error.png");
				$("#msg").html(curlang.Failed);
				setTimeout(function(){layer.close(animation);},2000);
			}
			if(type==4){
				$("#msg_type").children("img").attr("src","images/msg-success.png");
				$("#msg").html(curlang.Success);
				setTimeout(function(){layer.close(animation);restart('reboot');},2000);				
			}
            if(type==5){
                $("#msg_type").children("img").attr("src","/admin/images/msg-success.png");
                setTimeout(function(){layer.close(window.animation);},1000);
            }
		}

			if(obj==null||obj==""||(!obj)){
			 return;
			}else{
			if((typeof obj)=="object"){var msg=obj;}
			else{var msg=JSON.parse(obj); }
				if(msg.result==0){
					showanimation(4);
				}else{
					showanimation(3);
				}
			}		
		}
